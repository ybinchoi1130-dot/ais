<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>로그인</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">로그인</button>
            <button type="button" class="btn-secondary" onclick="location.href='/signup'">회원가입</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        // 이미 토큰이 있다면 할 일 목록으로 이동
        if (sessionStorage.getItem('access_token')) {
            window.location.href = '/list';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.textContent = '';
            messageDiv.className = 'message';

            try {
                const response = await fetch('/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = '로그인 성공!';
                    messageDiv.classList.add('success');
                    // Save token and redirect
                    sessionStorage.setItem('access_token', data.access_token);
                    if (data.email) {
                        sessionStorage.setItem('user_email', data.email);
                    }
                    window.location.href = '/list'; // Redirect to main page
                } else {
                    messageDiv.textContent = data.detail || '로그인에 실패했습니다.';
                    messageDiv.classList.add('error');
                }
            } catch (error) {
                messageDiv.textContent = '서버 오류가 발생했습니다.';
                messageDiv.classList.add('error');
            }
        });
    </script>
</body>
</html>
